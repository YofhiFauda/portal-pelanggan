## Production — beda dari `docker-compose.yaml` (dev-only: `npm run dev`,
## bind mount source, port 3001). File ini pakai stage `runner` Dockerfile
## (hasil `npm run build`, standalone, non-root) — cocok dipakai langsung
## sebagai referensi kalau Coolify/orchestrator lain dikonfigurasi lewat
## Docker Compose (bukan Dockerfile build pack polos).
##
## Env rahasia (LARAVEL_API_URL, PORTAL_CLIENT_SECRET, SESSION_COOKIE_SECRET)
## SENGAJA tidak di-hardcode di sini — diambil dari environment host/platform
## deploy saat `docker compose -f docker-compose.prod.yaml up`. Lihat
## `.env.example` untuk daftar lengkap + penjelasan tiap variabel.

services:
  web:
    build:
      context: .
      target: runner
      args:
        # ARG cuma kepakai saat BUILD image (Next.js nge-bake nilai ini ke
        # bundle client-side) — beda dari tiga env di bawah yang dibaca
        # RUNTIME. Kalau nilainya beda tiap environment, image harus
        # di-build ulang, bukan cukup ganti env container.
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      LARAVEL_API_URL: ${LARAVEL_API_URL}
      PORTAL_CLIENT_SECRET: ${PORTAL_CLIENT_SECRET}
      SESSION_COOKIE_SECRET: ${SESSION_COOKIE_SECRET}
    networks:
      - default
      - whusnet_network

# Sama seperti docker-compose.yaml (dev) — satu network Docker dengan
# Laravel (whusnet-operasional) biar Next.js manggil Laravel lewat nama
# container, bukan localhost. Kalau Laravel-nya di-deploy TERPISAH (host/
# stack Coolify lain, tanpa network Docker yang sama), hapus blok
# `whusnet_network` di sini dan di `networks.whusnet_network` bawah, lalu
# isi `LARAVEL_API_URL` dengan domain publik/internal Coolify-nya.
networks:
  default: {}
  whusnet_network:
    external: true
    name: whusnet-operasional_app_network
